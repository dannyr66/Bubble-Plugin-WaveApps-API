<!doctype html>

<body>
<div id="stage"></div>
<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eo = p => 1 - Math.pow(1 - p, 3);
const back = p => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, d = 0.35) => clamp((t - a) / d);
const anims = [];
const stage = document.getElementById('stage');

function el(tag, cls, parent, html, style) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  if (style) Object.assign(n.style, style);
  (parent || stage).appendChild(n);
  return n;
}
// Fade/slide an element in at tin and out at tout. base is a transform kept underneath.
function show(n, tin, tout = Infinity, kind = 'up', dur = 0.35, base = '') {
  anims.push(t => {
    const p = prog(t, tin, dur);
    const q = tout === Infinity ? 0 : prog(t, tout, 0.25);
    const o = (kind === 'pop' ? clamp(p * 3) : eo(p)) * (1 - q);
    let tr = '';
    if (kind === 'up') tr = `translateY(${(1 - eo(p)) * 34}px)`;
    if (kind === 'down') tr = `translateY(${(1 - eo(p)) * -34}px)`;
    if (kind === 'left') tr = `translateX(${(1 - eo(p)) * -40}px)`;
    if (kind === 'pop') tr = `scale(${lerp(0.5, 1, back(p))})`;
    if (kind === 'slideup') tr = `translateY(${(1 - eo(p)) * 100}%)`;
    n.style.opacity = kind === 'slideup' ? (1 - q) : o;
    n.style.transform = `${base} ${tr}`;
    n.style.visibility = (kind === 'slideup' ? (t < tin || q >= 1) : o <= 0.001) ? 'hidden' : 'visible';
  });
}
function scene(tin, tout) { const n = el('div', 'abs', stage, null, { inset: '0' }); show(n, tin, tout, 'fade', 0.3); return n; }

let TL, S;
function seg(id) { return S[id]; }

// Captions: words timed in proportion to their length inside each spoken line.
function buildCaptions() {
  const box = el('div', '', stage); box.id = 'caps';
  const lines = TL.segments.map(sg => {
    const words = sg.cap.split(/\s+/);
    const w = words.map(x => x.length + 1 + (/[.,?!]$/.test(x) ? 3 : 0));
    const tot = w.reduce((a, b) => a + b, 0);
    let acc = sg.s; const times = [];
    words.forEach((x, i) => { times.push(acc); acc += (sg.e - sg.s) * w[i] / tot; });
    const chunks = []; let cur = [];
    words.forEach((x, i) => {
      cur.push(i);
      const len = cur.map(j => words[j].length + 1).reduce((a, b) => a + b, 0);
      if (cur.length >= 4 || len > 20 || /[.,?!]$/.test(x)) { chunks.push(cur); cur = []; }
    });
    if (cur.length) chunks.push(cur);
    return { sg, words, times, chunks };
  });
  let key = '';
  anims.push(t => {
    const ln = lines.find((l, i) => t >= l.sg.s - 0.05 && (i === lines.length - 1 ? t <= l.sg.e + 1.2 : t < lines[i + 1].sg.s - 0.05));
    if (!ln) { if (key) { box.innerHTML = ''; key = ''; } return; }
    let wi = 0; ln.times.forEach((x, i) => { if (t >= x) wi = i; });
    const ch = ln.chunks.find(c => c.includes(wi)) || ln.chunks[0];
    const k = ln.sg.id + ':' + ln.chunks.indexOf(ch) + ':' + wi + ':' + (t > ln.sg.e);
    if (k === key) return; key = k;
    box.innerHTML = ch.map(j => `<span class="${j === wi && t <= ln.sg.e ? 'on' : j > wi ? 'future' : ''}">${ln.words[j]}</span>`).join('');
  });
}

function chrome() {
  const g = el('div', '', stage); g.id = 'glow';
  anims.push(t => { g.style.transform = `translate(${Math.sin(t * 0.4) * 40}px, ${Math.cos(t * 0.3) * 30}px)`; });
  el('div', '', stage, 'Rally').id = 'brand';
  el('div', '', stage, 'CONCEPT · AI VOICE').id = 'tag';
}
function sticker(tin, tout) {
  const n = el('div', '', stage, TL.sticker.replace(/</g, '&lt;')); n.id = 'sticker';
  show(n, tin, tout, 'pop', 0.4, 'rotate(-2.5deg)');
}
function endCard(tin, ctaHtml) {
  const n = el('div', 'end', stage);
  el('div', 'word', n, 'Rally');
  const l = el('div', 'line', n, 'Rally your crew. Run your day.');
  const c = el('div', 'cta', n, ctaHtml);
  show(n, tin, Infinity, 'fade', 0.3);
  show(l, tin + 0.35, Infinity, 'up');
  show(c, tin + 0.7, Infinity, 'pop', 0.45);
}
function phone(tin, tout) {
  const w = el('div', 'pwrap', stage);
  const p = el('div', 'phone', w);
  show(p, tin, tout, 'up', 0.5);
  return p;
}
const dotColor = { g: 'var(--good)', y: 'var(--warn)', r: 'var(--bad)' };

/* ---------- Ad 1 and its niche versions: Circumstance ---------- */
// n = segment index (0-based) a notification or toast is pinned to, plus an offset in seconds.
const CIRC = {
  circumstance: {
    day: 'Friday', time: '11:48', appTitle: 'Saturday', appSub: '4 parties',
    notifs: [[1, 0.15, '#34c759', 'J', 'Jess M.', 'did u get my deposit??'], [1, 0.9, '#34c759', 'M', 'Mark R.', 'what time are you guys coming tmrw'], [1, 1.65, '#34c759', 'P', 'Priya', 'is the $150 due before or after?'], [2, 0.05, '#ef4b3c', '!', 'Waivers', 'Johnson party · not signed'], [3, 0.05, '#2f7cf6', 'T', 'Tyler (crew)', 'yo whats the address for the 10am']],

    ph.style.marginLeft = off + 'px';

  [['9:00 AM', 'Pumpkin Patch Day', 'Penn Pumpkin Co. · Doylestown', 6], ['10:00 AM', 'Foam Party Deluxe', 'Philly Foam · Philadelphia', 1], ['11:30 AM', 'Fire Truck Visit', 'Fantastic Fire Dept · Newtown', 4], ['1:00 PM', 'Bubble Show', 'Bucks Bubbles · Yardley', 0], ['3:00 PM', 'Mini Golf, 9 holes', 'Mini Golf on the Go · Warminster', 3], ['6:30 PM', 'Glam Bot Booth', 'Philly Glam · Philadelphia', 7]].forEach(([tm, nm, sub, b], i) => {
    const r = el('div', 'row', app, `<i class="bdot" style="background:${brands[b][1]}"></i><div class="tm">${tm}</div><div class="nm"><b>${nm}</b><span>${sub}</span></div>`);
    show(r, G[2].s + 0.5 + i * 0.25, Infinity, 'up');
  });
  const one = el('div', 'sticker2', stage, 'One screen.<br>Not nine.');
  show(one, G[3].s + 1.2, G[4].s, 'pop', 0.4, 'rotate(2deg)');
  endCard(G[4].s, 'Comment <em>SATURDAY</em>');
}

window.boot = tl => {
  TL = tl; S = {}; tl.segments.forEach(s => S[s.id] = s);
  chrome();
  const ads = { realreason, receipt, pricetag, proofdrop };
  if (CIRC[tl.ad]) circ(CIRC[tl.ad]); else ads[tl.ad]();
  buildCaptions();
};
window.render = t => { for (const f of anims) f(t); };
</script>
